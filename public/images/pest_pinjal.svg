<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPinjal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#dce1e6"/>
    </radialGradient>
    <radialGradient id="fleaBody" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7a2512"/>
      <stop offset="70%" stop-color="#4a1205"/>
      <stop offset="100%" stop-color="#240702"/>
    </radialGradient>
    <filter id="shadowFlea" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgPinjal)"/>

  <!-- Flea Group -->
  <g filter="url(#shadowFlea)" transform="translate(60, 40) rotate(-10, 200, 220)">
    <!-- Powerful Long Hind Jumping Legs -->
    <path d="M 230 250 Q 280 180 320 190 T 360 280 Q 380 340 370 380" fill="none" stroke="#3b0f06" stroke-width="8" stroke-linecap="round"/>
    <path d="M 370 380 L 390 410" stroke="#3b0f06" stroke-width="5" stroke-linecap="round"/>

    <!-- Middle Legs -->
    <path d="M 180 260 Q 210 320 230 360 T 260 410" fill="none" stroke="#4a1508" stroke-width="7" stroke-linecap="round"/>

    <!-- Front Legs -->
    <path d="M 140 250 Q 130 310 110 350 T 90 390" fill="none" stroke="#4a1508" stroke-width="6" stroke-linecap="round"/>

    <!-- Laterally compressed high-backed abdomen -->
    <ellipse cx="260" cy="220" rx="90" ry="75" transform="rotate(-15, 260, 220)" fill="url(#fleaBody)"/>
    <!-- Abdomen Vertical Comb & Segment Bristles (Ctenidia) -->
    <path d="M 230 150 Q 240 220 230 290" stroke="#8c2f16" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 260 150 Q 270 220 260 290" stroke="#8c2f16" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 290 155 Q 300 220 290 285" stroke="#8c2f16" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 320 165 Q 325 215 315 270" stroke="#8c2f16" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Thorax segments -->
    <ellipse cx="175" cy="220" rx="28" ry="40" fill="url(#fleaBody)"/>
    <ellipse cx="150" cy="215" rx="22" ry="32" fill="url(#fleaBody)"/>

    <!-- Head with Pronotal comb (teeth/spines) -->
    <ellipse cx="125" cy="200" rx="30" ry="24" transform="rotate(15, 125, 200)" fill="url(#fleaBody)"/>
    <!-- Genal comb (teeth row on cheek) -->
    <path d="M 115 210 L 110 222 M 120 212 L 117 224 M 125 214 L 123 226 M 130 215 L 129 227" stroke="#1a0401" stroke-width="3" stroke-linecap="round"/>

    <!-- Simple Eye spot -->
    <circle cx="118" cy="192" r="4.5" fill="#110301"/>

    <!-- Mouthparts (Piercing stylets) -->
    <path d="M 105 212 L 90 235" stroke="#240702" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
