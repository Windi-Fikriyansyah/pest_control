<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTawon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#dce1e6"/>
    </radialGradient>
    <filter id="shadowWasp" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgTawon)"/>

  <!-- Tawon / Wasp Body -->
  <g filter="url(#shadowWasp)" transform="translate(60, 30)">
    <!-- Legs -->
    <path d="M 170 210 Q 110 200 80 250 T 60 320" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <path d="M 210 210 Q 270 200 300 250 T 320 320" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <path d="M 160 230 Q 100 270 90 340 T 70 410" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    <path d="M 220 230 Q 280 270 290 340 T 310 410" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>

    <!-- Translucent Wings (Amber Gold tint) -->
    <ellipse cx="110" cy="150" rx="95" ry="30" transform="rotate(-35, 110, 150)" fill="#f3d078" fill-opacity="0.5" stroke="#9d7426" stroke-width="1.5"/>
    <path d="M 180 190 Q 110 140 40 120" stroke="#7a5513" stroke-width="1.5" fill="none" opacity="0.7"/>

    <ellipse cx="270" cy="150" rx="95" ry="30" transform="rotate(35, 270, 150)" fill="#f3d078" fill-opacity="0.5" stroke="#9d7426" stroke-width="1.5"/>
    <path d="M 200 190 Q 270 140 340 120" stroke="#7a5513" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Abdomen (Gaster with Yellow & Black stripes) -->
    <g transform="translate(190, 80)">
      <!-- Base black abdomen shape -->
      <path d="M -30 90 C -38 40 -25 -10 0 -50 C 25 -10 38 40 30 90 Z" fill="#141414"/>
      <!-- Stinger -->
      <path d="M 0 -50 L 0 -70" stroke="#000" stroke-width="3" stroke-linecap="round"/>
      <!-- Yellow Stripes -->
      <path d="M -22 65 Q 0 75 22 65 Q 26 50 25 45 Q 0 55 -25 45 Z" fill="#fabc05"/>
      <path d="M -27 30 Q 0 40 27 30 Q 28 15 26 10 Q 0 20 -26 10 Z" fill="#fabc05"/>
      <path d="M -23 -5 Q 0 5 23 -5 Q 20 -18 16 -23 Q 0 -15 -16 -23 Z" fill="#fabc05"/>
    </g>

    <!-- Slender Waist (Petiole) -->
    <ellipse cx="190" cy="180" rx="8" ry="12" fill="#0d0d0d"/>

    <!-- Thorax -->
    <ellipse cx="190" cy="210" rx="34" ry="28" fill="#1b1c1e"/>
    <path d="M 175 198 Q 190 206 205 198" stroke="#fabc05" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Head -->
    <ellipse cx="190" cy="254" rx="26" ry="22" fill="#fabc05"/>
    <!-- Large dark compound eyes -->
    <ellipse cx="170" cy="252" rx="9" ry="15" fill="#111" transform="rotate(-15, 170, 252)"/>
    <ellipse cx="210" cy="252" rx="9" ry="15" fill="#111" transform="rotate(15, 210, 252)"/>

    <!-- Antennae -->
    <path d="M 182 268 Q 160 295 145 325 T 130 350" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 198 268 Q 220 295 235 325 T 250 350" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
