<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgNgengat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#dce1e6"/>
    </radialGradient>
    <linearGradient id="wingGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbb082"/>
      <stop offset="50%" stop-color="#ab8f62"/>
      <stop offset="100%" stop-color="#735b36"/>
    </linearGradient>
    <linearGradient id="wingGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbb082"/>
      <stop offset="50%" stop-color="#ab8f62"/>
      <stop offset="100%" stop-color="#735b36"/>
    </linearGradient>
    <filter id="shadowMoth" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgNgengat)"/>

  <!-- Moth Wings and Body -->
  <g filter="url(#shadowMoth)" transform="translate(60, 40)">
    <!-- Hind Wings -->
    <ellipse cx="145" cy="245" rx="60" ry="38" transform="rotate(-30, 145, 245)" fill="#9c8052" opacity="0.85"/>
    <ellipse cx="235" cy="245" rx="60" ry="38" transform="rotate(30, 235, 245)" fill="#9c8052" opacity="0.85"/>

    <!-- Fore Wings Left -->
    <path d="M 190 200 C 130 140 60 170 80 260 C 100 310 170 280 190 230 Z" fill="url(#wingGradLeft)"/>
    <!-- Wing Texture & Fringes -->
    <path d="M 100 230 Q 140 215 180 210" stroke="#523e20" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 85 250 Q 130 240 180 225" stroke="#523e20" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Fore Wings Right -->
    <path d="M 190 200 C 250 140 320 170 300 260 C 280 310 210 280 190 230 Z" fill="url(#wingGradRight)"/>
    <path d="M 280 230 Q 240 215 200 210" stroke="#523e20" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 295 250 Q 250 240 200 225" stroke="#523e20" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Fuzzy Moth Body -->
    <!-- Abdomen -->
    <ellipse cx="190" cy="255" rx="16" ry="35" fill="#5a4325"/>
    <!-- Abdomen rings -->
    <path d="M 178 240 Q 190 245 202 240" stroke="#8a6d44" stroke-width="2" fill="none"/>
    <path d="M 176 258 Q 190 263 204 258" stroke="#8a6d44" stroke-width="2" fill="none"/>
    <path d="M 178 275 Q 190 280 202 275" stroke="#8a6d44" stroke-width="2" fill="none"/>

    <!-- Thorax with tuft of hairs -->
    <ellipse cx="190" cy="205" rx="20" ry="22" fill="#7a5d34"/>
    <ellipse cx="190" cy="200" rx="14" ry="12" fill="#9e7b49"/>

    <!-- Head -->
    <circle cx="190" cy="180" r="14" fill="#543e20"/>
    <ellipse cx="178" cy="178" rx="5" ry="7" fill="#1c140a"/>
    <ellipse cx="202" cy="178" rx="5" ry="7" fill="#1c140a"/>

    <!-- Feathered (Plumose) Antennae -->
    <!-- Left Antenna -->
    <path d="M 184 172 Q 150 135 110 120" stroke="#4a371c" stroke-width="2.5" fill="none"/>
    <path d="M 175 165 L 170 156 M 165 158 L 158 148 M 155 150 L 146 140 M 143 142 L 132 133 M 130 135 L 118 126" stroke="#4a371c" stroke-width="1.5"/>

    <!-- Right Antenna -->
    <path d="M 196 172 Q 230 135 270 120" stroke="#4a371c" stroke-width="2.5" fill="none"/>
    <path d="M 205 165 L 210 156 M 215 158 L 222 148 M 225 150 L 234 140 M 237 142 L 248 133 M 250 135 L 262 126" stroke="#4a371c" stroke-width="1.5"/>
  </g>
</svg>
