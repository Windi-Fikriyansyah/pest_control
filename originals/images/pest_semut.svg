<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#dce1e6"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d9381e"/>
      <stop offset="70%" stop-color="#8a1805"/>
      <stop offset="100%" stop-color="#4a0800"/>
    </radialGradient>
    <radialGradient id="thoraxGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e04e22"/>
      <stop offset="75%" stop-color="#992008"/>
      <stop offset="100%" stop-color="#540e02"/>
    </radialGradient>
    <radialGradient id="abdomenGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7a1403"/>
      <stop offset="65%" stop-color="#380600"/>
      <stop offset="100%" stop-color="#140200"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle matching studio photo style -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- Ant Body Group with realistic fire ant anatomy -->
  <g filter="url(#shadow)" transform="translate(40, 20) rotate(-15, 200, 250)">
    <!-- Back legs -->
    <path d="M 230 240 Q 280 200 320 230 T 380 320" fill="none" stroke="#661002" stroke-width="8" stroke-linecap="round"/>
    <path d="M 220 250 Q 290 280 350 320 T 400 400" fill="none" stroke="#520d02" stroke-width="9" stroke-linecap="round"/>
    <path d="M 190 230 Q 230 150 270 140 T 320 180" fill="none" stroke="#661002" stroke-width="7" stroke-linecap="round"/>

    <!-- Front legs -->
    <path d="M 170 240 Q 120 180 90 190 T 50 260" fill="none" stroke="#8a1805" stroke-width="7" stroke-linecap="round"/>
    <path d="M 190 260 Q 130 280 110 350 T 80 410" fill="none" stroke="#7a1403" stroke-width="8" stroke-linecap="round"/>
    <path d="M 210 265 Q 170 340 180 390 T 210 440" fill="none" stroke="#661002" stroke-width="8" stroke-linecap="round"/>

    <!-- Abdomen (Gaster) -->
    <ellipse cx="300" cy="270" rx="65" ry="45" transform="rotate(35, 300, 270)" fill="url(#abdomenGrad)"/>
    <!-- Abdomen segments shine -->
    <path d="M 270 245 Q 295 260 300 295" stroke="#ba2b0f" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 300 235 Q 325 250 330 285" stroke="#ba2b0f" stroke-width="2.5" fill="none" opacity="0.5"/>

    <!-- Petiole (Waist nodes) -->
    <ellipse cx="232" cy="250" rx="14" ry="11" fill="url(#thoraxGrad)"/>
    <ellipse cx="214" cy="245" rx="11" ry="9" fill="url(#thoraxGrad)"/>

    <!-- Thorax (Mesosoma) -->
    <ellipse cx="185" cy="235" rx="36" ry="24" transform="rotate(-15, 185, 235)" fill="url(#thoraxGrad)"/>
    <ellipse cx="160" cy="226" rx="22" ry="17" fill="url(#thoraxGrad)"/>

    <!-- Head -->
    <ellipse cx="120" cy="205" rx="32" ry="27" transform="rotate(-20, 120, 205)" fill="url(#headGrad)"/>
    <!-- Compound Eye -->
    <ellipse cx="112" cy="192" rx="6" ry="8" fill="#150200"/>
    <circle cx="110" cy="190" r="1.5" fill="#ffffff" opacity="0.8"/>

    <!-- Mandibles -->
    <path d="M 96 215 Q 86 225 80 235 Q 92 230 102 222 Z" fill="#4a0800"/>
    <path d="M 90 208 Q 80 216 76 226 Q 88 220 98 214 Z" fill="#5c0b00"/>

    <!-- Antennae -->
    <path d="M 124 186 Q 105 140 80 135 T 50 160" fill="none" stroke="#8a1805" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 134 188 Q 130 130 115 110 T 110 80" fill="none" stroke="#7a1403" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
